<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="¡Hola, Amigo!" />
    <meta name="description" content="¡Hola, Amigo! — a fun, interactive Spanish course for kids aged 6+. Learn A1 to A2 with games, stories and speaking practice." />
    <title>¡Hola, Amigo! — Learn Spanish</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <script>
      // Apply the saved theme before first paint (no flash of the wrong colours).
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("hola_prefs") || "{}").theme || "galaxy"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>¡Hola, Amigo! needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
