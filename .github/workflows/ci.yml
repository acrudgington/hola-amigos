# Runs on every push and pull request: types, content, unit tests, build and
# real-browser end-to-end tests. A red ✗ on a pull request means don't merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hola-amigo

jobs:
  check:
    name: Typecheck, content, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hola-amigo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (phone + desktop)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hola-amigo/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --trace off
        env:
          CI: true
